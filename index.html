<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tembak Mantan 💔</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar"><div><span class="eyebrow">RELATIONSHIP SURVIVAL ARCADE</span><h1>TEMBAK MANTAN <span>💔</span></h1></div><button id="startBtn">MULAI GAME</button></header>
    <section class="hud"><div>SKOR <b id="score">0</b></div><div>NYAWA <b id="lives">❤️❤️❤️</b></div><div>LEVEL <b id="level">1</b></div><div>BEST <b id="best">0</b></div></section>
    <section id="game" class="game"><div class="hint">GERAK: ← → / A D &nbsp; • &nbsp; TEMBAK: SPASI</div><div id="player" class="player">🧍</div><div id="message" class="message">Klik “Mulai Game”<br><small>Hancurkan semua kenangan buruk.</small></div><div class="mobile-controls"><button id="leftBtn">◀</button><button id="fireBtn">💥</button><button id="rightBtn">▶</button></div></section>
    <footer><span>Target hari ini: move on.</span><span id="status">Siap membalas dengan sehat.</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
